apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apiserver-pvc
  namespace: dependency-track
spec:
  accessMode:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: dependency-track
spec:
  accessMode:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi